name: CI/CD - Local Deploy (Runner)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
env:
    DB_HOST: 127.0.0.1
    DB_USER: root
    DB_PASSWORD: root
    DB_NAME: todolist_db
    DB_DIALECT: mysql
    PORT: 3000
    NODE_ENV: test
jobs:
    test:
        name: "Tests (Jest: unit + integration)"
        runs-on: ubuntu-latest

        services:
            mysql:
                image: mysql:5.7
                env:
                    MYSQL_ROOT_PASSWORD: root
                    MYSQL_DATABASE: todolist_db
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -p root"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=20
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node18 + npm cache
              uses: actions/setup-node@v4
              with:
                  node-version: '18'
                  cache: 'npm'
                  cache-dependency-path: package-lock.json
            - name: Install dependencies
              run: npm ci
            - name: Wait for MySQL to be ready
              run: |
                  echo "Waiting for MySQL to be ready..."
                  for i in {1..30}; do
                      if mysqladmin ping -h 127.0.0.1 -u root -proot --silent; then
                          echo "MySQL is ready!"
                          exit 0
                      fi
                      echo "Waiting for MySQL... ($i/30)"
                      sleep 2
                  done
                  echo "MySQL did not become ready in time."
                  exit 1
            - name: Run tests
              run: npm test
    build:
        name: "Build Docker Image"
        runs-on: ubuntu-latest
        needs: test

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Build image
              run: docker build -t projet-fil-rouge:ci .

    deploy_local:
        name: "Local deploy (runner) + smoke test"
        runs-on: ubuntu-latest
        needs: build

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Run MySQL container
              run: |
                  docker run -d --name todolist-mysql \
                  -e MYSQL_ROOT_PASSWORD=root \
                  -e MYSQL_DATABASE=todolist_db \
                  -p 3306:3306 \
                  --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -p root" \
                  --health-interval=5s \
                  --health-timeout=5s \
                  --health-retries=20 \
                  mysql:5.7
            - name: Wait for MySQL health check
              run: |
                  echo "Waiting for MySQL to be ready..."
                  for i in {1..30}; do
                      status=$(docker inspect --format='{{.State.Health.Status}}' todolist-mysql 2> /dev/null || echo "starting")
                      echo "MySQL health status: $status"
                      if [ "$status" == "healthy" ]; then
                          echo "MySQL is ready!"
                          exit 0
                      fi
                      echo "Waiting for MySQL... ($i/30)"
                      sleep 2
                  done
                  docker logs todolist-mysql
                  echo "MySQL did not become ready in time."
                  exit 1
            - name: Wait API reachable
              run: |  
                  for i in {1..30}; do
                      if curl -fsS http://localhost:3000/api/tasks > /dev/null; then
                          echo "API is reachable!"
                          exit 0
                      fi
                      echo "Waiting for API... ($i/30)"
                      sleep 2
                  done
                  docker logs todolist-api
                  echo "API is not reachable."
                  exit 1
            - name: Smoke test (GET /api/tasks)
              run: |  
                  curl -fsS http://localhost:3000/api/tasks
            - name: Stop MySQL container
              if: always()
              run: |
                docker rm-f todolist-api todolist-mysql || true